<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Endpoints</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f4f4f4;
            padding-top: 30px;
        }
        .card {
            margin-bottom: 15px;
        }
        .accordion-button::after {
            filter: invert(0.5);
        }
        pre {
            background: #e9ecef;
            padding: 10px;
            border-radius: 4px;
            overflow-x: auto;
        }
    </style>
</head>

<body>
<div class="container">
    <h1 class="text-center mt-4">API Endpoints</h1>
    
    <input type="text" id="searchBar" class="form-control mb-3" placeholder="Search API...">

    <div class="accordion" id="apiAccordion">
        <!-- Groups will be inserted here dynamically -->
    </div>

    <!-- Bootstrap Alert Section for Copy URL Feedback -->
    <div id="alert-container" class="m-3"></div>

</div>

<!-- Bootstrap JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
async function loadApiData() {
    try {
        const response = await fetch('endpoints.json');
        const data = await response.json();
        const accordion = document.getElementById('apiAccordion');

        data.groups.forEach((group, i) => {
            const groupId = `group${i}`;
            const endpointCount = group.endpoints.length;

            let groupHTML = `
                <div class="accordion-item">
                    <h2 class="accordion-header" id="heading${groupId}">
                        <button class="accordion-button collapsed" type="button" 
                            data-bs-toggle="collapse" data-bs-target="#collapse${groupId}" 
                            aria-expanded="false" aria-controls="collapse${groupId}">
                            ${group.name}
                            <span class="badge bg-primary ms-3">${endpointCount} Endpoint${endpointCount !== 1 ? 's' : ''}</span>
                        </button>
                    </h2>
                    <div id="collapse${groupId}" class="accordion-collapse collapse" 
                         aria-labelledby="heading${groupId}" data-bs-parent="#apiAccordion">
                        <div class="accordion-body">
                            <div class="row">`;

            group.endpoints.forEach(endpoint => {
                groupHTML += `
                    <div class="col-md-4">
                        <div class="card shadow-sm">
                            <div class="card-body">
                                <h5 class="card-title">${endpoint.name}</h5>
                                <p class="card-text">${endpoint.description}</p>
                                <p><strong>Method:</strong> <span class="badge bg-info">${endpoint.method}</span></p>
                                <p><strong>Endpoint:</strong> <code>${endpoint.path}</code></p>
                                <button class="btn btn-secondary btn-sm copy-btn" data-url="${endpoint.url}">Copy URL</button>
                            </div>
                        </div>
                    </div>
                `;
            });

            groupHTML += `
                            </div>
                        </div>
                    </div>
                </div>
            `;

            accordion.innerHTML += groupHTML;
        });

        // Attach event listeners to copy buttons
        const copyButtons = document.querySelectorAll('.copy-btn');
        copyButtons.forEach(button => {
            button.addEventListener('click', function() {
                const url = this.getAttribute('data-url');

                // Copy URL to clipboard
                navigator.clipboard.writeText(url).then(() => {
                    showAlert(`URL copied: ${url}`, 'success');
                }).catch(err => {
                    console.error('Failed to copy: ', err);
                    showAlert('Failed to copy URL. Please try again.', 'danger');
                });
            });
        });
        
    } catch (error) {
        console.error('Error loading API data:', error);
        document.getElementById('apiAccordion').innerHTML = `
            <div class="alert alert-danger" role="alert">
                Failed to load API data. Please check your JSON file or try again later.
            </div>
        `;
    }
}

// Search functionality
document.getElementById('searchBar').addEventListener('input', function() {
    const searchTerm = this.value.toLowerCase();
    const allCards = document.querySelectorAll('.accordion-item');
    allCards.forEach(card => {
        const cardTitle = card.querySelector('.accordion-button').textContent.toLowerCase();
        const cardDescription = card.querySelector('.card-text').textContent.toLowerCase();
        if (cardTitle.includes(searchTerm) || cardDescription.includes(searchTerm)) {
            card.style.display = '';
        } else {
            card.style.display = 'none';
        }
    });
});

// Function to show Bootstrap alert
function showAlert(message, type) {
    const alertContainer = document.getElementById('alert-container');

    // Create the alert element
    const alertHTML = `
        <div class="alert alert-${type} alert-dismissible fade show" role="alert">
            ${message}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
    `;

    // Insert the alert into the container
    alertContainer.innerHTML = alertHTML;

    // Optionally, auto-dismiss after a few seconds
    setTimeout(() => {
        const alert = alertContainer.querySelector('.alert');
        if (alert) {
            alert.classList.remove('show');
        }
    }, 5000);
}

loadApiData();
</script>
</body>
</html>
